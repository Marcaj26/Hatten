<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julegavehatten 🎩🎁</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Julebaggrund: Dyb rød og juletræsgrøn gradient */
            background: linear-gradient(135deg, #8b0000 0%, #1c3d25 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Let sne-effekt i baggrunden */
        body::before {
            content: "❄ ❅ ❆ ❄ ❅ ❆ ❄ ❅ ❆ ❄ ❅ ❆";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            font-size: 1.5rem;
            letter-spacing: 20px;
            z-index: -1;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
            margin-bottom: 2rem;
            border: 3px solid #d4af37; /* Fin guld-kant */
        }

        h1 { 
            margin-top: 0; 
            color: #c0392b; 
            font-size: 2.2rem; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p { 
            color: #555; 
            margin-bottom: 1.5rem; 
            font-size: 1.05rem;
        }

        input[type="text"] {
            width: 80%;
            padding: 0.9rem;
            font-size: 1.1rem;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: #27ae60; }

        .result-box {
            font-size: 1.8rem;
            font-weight: bold;
            color: #c0392b;
            margin: 1.5rem 0;
            min-height: 2.4rem;
            background: #fdf2f2;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #e74c3c;
        }

        button {
            background-color: #27ae60; /* Julegrøn */
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        button:hover { 
            background-color: #219653; 
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        .overview-card {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            padding: 1.8rem;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            border: 3px solid #27ae60;
        }

        .overview-card h2 {
            font-size: 1.4rem;
            margin-top: 0;
            color: #c0392b;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 0.6rem;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        li {
            padding: 0.7rem 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            font-size: 1.05rem;
        }

        li:last-child { border-bottom: none; }
        .user-name { font-weight: bold; color: #2c3e50; }
        .user-draw { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Julegavehatten 🎅🎁</h1>
        <p>Indtast dit navn og træk fra hatten! 🎄</p>

        <div id="setupForm">
            <input type="text" id="userNameInput" placeholder="Skriv dit navn her..." />
            <br>
            <button id="drawBtn">Træk fra hatten! 🎁</button>
        </div>

        <div id="resultBox" class="result-box" style="display: none;"></div>
    </div>

    <div class="overview-card">
        <h2>Hvad trak de andre? 📜✨</h2>
        <ul id="overviewList">
            <li><em>Henter data fra Nordpolen...</em></li>
        </ul>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwlhAOwk-FtFzUHt374EsTPE4nHZWAaAziOSx-edANqX7--Ge7OBO9SzhS5mUagIoI/exec";

        const userNameInput = document.getElementById("userNameInput");
        const drawBtn = document.getElementById("drawBtn");
        const setupForm = document.getElementById("setupForm");
        const resultBox = document.getElementById("resultBox");
        const overviewList = document.getElementById("overviewList");

        // 1. Hent data fra Google Sheets når siden åbnes
        async function fetchDraws() {
            try {
                const response = await fetch(SCRIPT_URL);
                const draws = await response.json();
                updateUIList(draws);

                const myName = localStorage.getItem("mitHatteNavn");
                if (myName) {
                    const existingDraw = draws.find(d => d.name.toLowerCase() === myName.toLowerCase());
                    if (existingDraw) {
                        setupForm.style.display = "none";
                        resultBox.style.display = "block";
                        resultBox.innerHTML = `<small>Ho ho ho, ${existingDraw.name}! Du har trukket:</small><br>🎁 ${existingDraw.item} 🎁`;
                    }
                }
            } catch (error) {
                overviewList.innerHTML = "<li><em>Kunne ikke hente julelisten...</em></li>";
            }
        }

        function updateUIList(draws) {
            overviewList.innerHTML = "";
            if (draws.length === 0) {
                overviewList.innerHTML = "<li><em>Ingen har trukket endnu... Vær den første! 🎅</em></li>";
                return;
            }
            draws.forEach(entry => {
                const li = document.createElement("li");
                li.innerHTML = `<span class="user-name">${entry.name}</span> <span class="user-draw">🎁 ${entry.item}</span>`;
                overviewList.appendChild(li);
            });
        }

        // 2. Træk-knap logik
        drawBtn.addEventListener("click", async function() {
            const name = userNameInput.value.trim();
            if (!name) {
                alert("Husk at skrive dit navn først, nisseven!");
                return;
            }

            drawBtn.textContent = "Trækker fra hatten... 🎩";
            drawBtn.disabled = true;

            try {
                // Send navnet til Google Sheet, som vælger et ledigt navn
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ name: name })
                });
                const result = await response.json();

                if (result.status === "error") {
                    alert(result.message);
                    drawBtn.textContent = "Træk fra hatten! 🎁";
                    drawBtn.disabled = false;
                    return;
                }

                const chosenItem = result.item;

                // Gem navnet lokalt på denne enhed
                localStorage.setItem("mitHatteNavn", name);

                // Vis resultatet
                setupForm.style.display = "none";
                resultBox.style.display = "block";
                resultBox.innerHTML = `<small>Ho ho ho, ${name}! Du har trukket:</small><br>🎁 ${chosenItem} 🎁`;

                // Opdater oversigtslisten
                fetchDraws();

            } catch (error) {
                alert("Noget gik galt i Nissernes Værksted. Prøv igen.");
                drawBtn.textContent = "Træk fra hatten! 🎁";
                drawBtn.disabled = false;
            }
        });

        // Kør ved start
        fetchDraws();
    </script>

</body>
</html>
